apiVersion: v1
kind: Service
metadata:
  name: metadata-service-eks
  labels:
    app: metadata
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "elb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  selector:
    app: metadata
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http